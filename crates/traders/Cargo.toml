[package]
name = "pewterdesk-traders"
version = "0.0.0"
description = "Top traders: Hyperliquid's and OKX's public leaderboards, a trader's public positions and history, and what changed between two looks at them. Read-only; shared by the app and the watch server"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pewterdesk-core = { path = "../core" }
# The same versions and features the app already uses, so nothing new is downloaded.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros"] }
