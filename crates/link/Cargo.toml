[package]
name = "pewterdesk-link"
version = "0.0.0"
description = "A program's connection to the daemon (pdd): pd's and the app's, over its socket or its local WebSocket; and keeping pdd running (the LaunchAgent)"
edition.workspace = true
rust-version.workspace = true
publish = false

# Security-relevant: it carries a client's pairing token to the daemon.
# Every crate here is already in the workspace's lockfile.
[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
pewterdesk-protocol = { path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-tungstenite = "0.29.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "macros", "time"] }
