[package]
name = "pewterdesk-calendar"
version = "0.0.0"
description = "The week's economic calendar (Forex Factory's export) for the trading rules' news blackout, shared by the app and the daemon"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
pewterdesk-core = { path = "../core" }
pewterdesk-engine = { path = "../engine" }
# The same versions and features the app already uses, so nothing new is downloaded.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros"] }
