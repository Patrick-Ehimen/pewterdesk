[package]
name = "pewterdesk-exchange-hyperliquid"
version = "0.0.0"
description = "Hyperliquid adapter for pewterdesk"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pewterdesk-core = { path = "../core" }
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
