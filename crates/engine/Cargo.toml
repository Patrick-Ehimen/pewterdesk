[package]
name = "pewterdesk-engine"
version = "0.0.0"
description = "Routes every trading operation through the gate (live-trading switch and trading rules) to a venue adapter"
edition.workspace = true
rust-version.workspace = true
publish = false

# Depends on `core` and its own event log (`store`) only: the host (the
# desktop app, later the daemon) hands it the venue adapters and the economic
# calendar. Never a venue crate.
[dependencies]
async-trait = "0.1.92"
pewterdesk-core = { path = "../core" }
pewterdesk-store = { path = "../store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt"] }
