[package]
name = "pewterdesk-protocol"
version = "0.0.0"
description = "What a client may ask the engine (JSON-RPC 2.0, versioned) and the command language it's typed in"
edition.workspace = true
rust-version.workspace = true
publish = false

# Types and parsing only: no I/O, no venue crate, no engine. The daemon and
# the app speak it; `pd` sends it. Security-relevant: it defines what a
# client can ask for (docs/bots/safety.md).
[dependencies]
pewterdesk-core = { path = "../core" }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = "12.0.1"
