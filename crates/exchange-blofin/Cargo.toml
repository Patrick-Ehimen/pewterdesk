[package]
name = "pewterdesk-exchange-blofin"
version = "0.0.0"
description = "BloFin USDT-M perpetuals adapter for pewterdesk"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pewterdesk-core = { path = "../core" }
async-trait = "0.1.92"
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query", "gzip"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
zeroize = "1.9.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
