[package]
name = "pewterdesk-store"
version = "0.0.0"
description = "The engine's event log: an append-only SQLite record of every routed command, gate decision and venue result"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The engine id that client order ids start with, made once per log.
getrandom = "0.4.3"
# SQLite compiled in, so the log doesn't depend on the OS's copy.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
