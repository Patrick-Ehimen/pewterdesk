[package]
name = "pewterdesk-core"
version = "0.0.0"
description = "Exchange-agnostic domain types and the ExchangeAdapter trait"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
ts-rs = "12.0.1"
zeroize = "1.9.0"

[dev-dependencies]
serde_json = "1.0.151"
