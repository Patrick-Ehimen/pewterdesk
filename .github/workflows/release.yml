name: Release

# Pushing a version tag (v0.1.0) builds the desktop app on every platform and
# attaches the installers to a draft GitHub release, to check and publish by
# hand; once published it's a full release, marked Latest. (For a test build
# that shouldn't be Latest, tick "Set as a pre-release" when publishing.)
# Running it manually builds the same installers without a release, as
# a dry run; they're kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # WebKitGTK for the webview, appindicator for the tray, D-Bus for the
      # keychain (Secret Service).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev patchelf

      # Version comes from root package.json's "packageManager" field.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only a tag push creates the release; a manual run just builds.
      # The updater's files (each installer's .sig, and latest.json on the
      # release, which installed apps read) are signed with the updater key:
      # only builds signed with it install as an update (updater.rs). Local
      # builds (`make bundle`) skip them, having no key.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # PewterDesk Cloud's project, fixed into the build (see .env.cloud.example);
          # without them the Plan page and the cloud's other parts say there's no cloud.
          PEWTERDESK_CLOUD_URL: ${{ secrets.PEWTERDESK_CLOUD_URL }}
          PEWTERDESK_CLOUD_KEY: ${{ secrets.PEWTERDESK_CLOUD_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: PewterDesk ${{ github.ref_name }}
          releaseBody: |
            Early release, still in development. Market data, accounts and trading on
            Hyperliquid, Aster, Bybit and Binance, and on BloFin's Demo Trading accounts.
            Connect a Hyperliquid or Aster API wallet (trade-only, it can't withdraw) or
            a Bybit, Binance or BloFin API key. Orders work on Demo Trading accounts as
            soon as they're connected; on a live account, only once you turn live
            trading on for it. Hyperliquid and Aster also have paper trading.

            New since v0.5.0: a Plan & journal page (a daily check-in and watchlist,
            your trading plan, playbooks, a journal of every trade with notes,
            screenshots and a reflection, and reviews), kept in PewterDesk Cloud once
            you sign in by email; a Screener page with a technical rating and token
            details; on the Maps page, a pump / dump watch with exchange listing news,
            scans and alerts, including squeeze, Bollinger and RSI alerts; PewterDesk AI
            with Mistral, a thinking panel, cited sources and shareable answers, its
            chats kept in the cloud; a replay account to practise on past candles;
            prices and money in other currencies; paper trading in the floating window;
            Portfolio from your account's picture; market alerts that keep firing with
            the app quit; new themes; and updates installed from inside the app.

            Live trading is new: start with a small order.

            Requires macOS 13 (Ventura) or later, Windows 10 or later, or Linux with
            WebKitGTK 4.1 (Ubuntu 22.04 or newer).

            The builds aren't code-signed, so the OS warns on first launch:
            - macOS: open it once, then go to System Settings > Privacy & Security
              and choose Open Anyway next to PewterDesk.
            - Windows: in SmartScreen, choose More info, then Run anyway.
          releaseDraft: true
          prerelease: false

      - name: Keep the installers (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: pewterdesk-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
