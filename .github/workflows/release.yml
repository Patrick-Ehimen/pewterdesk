name: Release

# Pushing a version tag (v0.1.0) builds the desktop app on every platform and
# attaches the installers to a draft GitHub release, to check and publish by
# hand. Running it manually builds the same installers without a release, as
# a dry run; they're kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # WebKitGTK for the webview, appindicator for the tray, D-Bus for the
      # keychain (Secret Service).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev patchelf

      # Version comes from root package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only a tag push creates the release; a manual run just builds.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: PewterDesk ${{ github.ref_name }}
          releaseBody: |
            Early pre-release. Live market data from Hyperliquid and Bybit; connect
            a Hyperliquid API wallet or a Bybit API key to see your account.
            Orders can be placed on Bybit Demo Trading accounts only: live accounts
            are read-only for now.

            Requires macOS 13 (Ventura) or later, Windows 10 or later, or Linux with
            WebKitGTK 4.1 (Ubuntu 22.04 or newer).

            The builds aren't code-signed, so the OS warns on first launch:
            - macOS: open it once, then go to System Settings > Privacy & Security
              and choose Open Anyway next to PewterDesk.
            - Windows: in SmartScreen, choose More info, then Run anyway.
          releaseDraft: true
          prerelease: true

      - name: Keep the installers (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: pewterdesk-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
