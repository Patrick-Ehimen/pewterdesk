[package]
name = "pewterdesk"
version = "0.0.0"
description = "Non-custodial, multi-venue crypto derivatives trading terminal"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# The _lib suffix avoids a name clash with the bin target on Windows.
name = "pewterdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
