[package]
name = "pewterdesk"
version = "0.0.0"
description = "Non-custodial, multi-venue crypto derivatives trading terminal"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
# The _lib suffix avoids a name clash with the bin target on Windows.
name = "pewterdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# macOS labels an unbundled process (i.e. `make dev`) by its executable name,
# so the binary carries the product name rather than the crate name.
[[bin]]
name = "PewterDesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring = "4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
