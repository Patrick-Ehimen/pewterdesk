[package]
name = "pewterdesk"
version = "0.1.0"
description = "Non-custodial, multi-venue crypto derivatives trading terminal"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
# The _lib suffix avoids a name clash with the bin target on Windows.
name = "pewterdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# macOS labels an unbundled process (i.e. `make dev`) by its executable name,
# so the binary carries the product name rather than the crate name.
[[bin]]
name = "PewterDesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent windows on macOS, for the tray panel's
# rounded corners. Apple doesn't accept private-API apps in the Mac App Store.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
keyring = "4"
pewterdesk-core = { path = "../../../crates/core" }
pewterdesk-exchange-hyperliquid = { path = "../../../crates/exchange-hyperliquid" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }

# The tray's coloured title (green/red) is an AppKit attributed string; these
# are the same bindings the tray itself uses, so nothing new is downloaded.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSAttributedString", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSButton", "NSColor", "NSControl", "NSFont", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }

[dev-dependencies]
serde_json = "1"
